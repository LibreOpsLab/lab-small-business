---
# Grafana Alloy ships each host's systemd journal (sshd, sudo, services, kernel) to Loki.
# Alloy replaced Promtail, which Grafana has retired. See docs/Logging.md.

- name: Install prerequisites for the Grafana apt repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download the Grafana repository signing key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: Add the Grafana apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    filename: grafana
    state: present

- name: Install Alloy
  ansible.builtin.apt:
    name: alloy
    state: present
    update_cache: true

# Alloy runs as the "alloy" user, which cannot read the journal until it is in this group.
- name: Let Alloy read the systemd journal
  ansible.builtin.user:
    name: alloy
    groups: systemd-journal
    append: true
  notify: restart alloy

# Holds the push password, so it is readable by root and the alloy group only.
- name: Render the Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: "0640"
  notify: restart alloy

- name: Enable and start Alloy
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started
