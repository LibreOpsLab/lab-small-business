---
# Wraps the samba/scripts/*.sh automation in Ansible so the whole lab can be brought up from
# one `ansible-playbook site.yml` run. The shell scripts remain the source of truth (and are
# usable standalone per docs/SambaAdmin.md) — this role just orchestrates them idempotently.

- name: Check whether the domain is already provisioned
  ansible.builtin.stat:
    path: /var/lib/samba/private/sam.ldb
  register: sam_ldb

- name: Copy repository to the DC
  ansible.posix.synchronize:
    src: "{{ repo_root_on_controller }}/"
    dest: /opt/lab-small-business/
    rsync_opts:
      - "--exclude=.git"
  delegate_to: "{{ inventory_hostname }}"

- name: Run bootstrap-ad.sh (domain provisioning)
  ansible.builtin.command: ./bootstrap-ad.sh
  args:
    chdir: /opt/lab-small-business/samba/scripts
  environment:
    SAMBA_ADMIN_PASSWORD: "{{ samba_admin_password }}"
  when: not sam_ldb.stat.exists

- name: Run create-ous.sh (idempotent)
  ansible.builtin.command: ./create-ous.sh
  args:
    chdir: /opt/lab-small-business/samba/scripts
  changed_when: true

- name: Run create-groups.sh (idempotent)
  ansible.builtin.command: ./create-groups.sh
  args:
    chdir: /opt/lab-small-business/samba/scripts
  changed_when: true

- name: Run create-users.sh (idempotent)
  ansible.builtin.command: ./create-users.sh
  args:
    chdir: /opt/lab-small-business/samba/scripts
  environment:
    SAMBA_SEED_PASSWORD: "{{ samba_seed_password }}"
  changed_when: true

- name: Render smb.conf from template (LDAPS + DNS forwarder settings)
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../samba/templates/smb.conf.j2"
    dest: /etc/samba/smb.conf
    mode: "0644"
  notify: restart samba-ad-dc

- name: Run health-check.sh to confirm the DC is healthy
  ansible.builtin.command: ./health-check.sh
  args:
    chdir: /opt/lab-small-business/samba/scripts
  register: health_check
  changed_when: false
  failed_when: health_check.rc != 0
