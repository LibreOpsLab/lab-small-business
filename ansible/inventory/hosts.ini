; LAB.INTERNAL inventory. pfSense and the two desktop clients are intentionally excluded —
; pfSense is not Ansible-managed (see pfsense/README.md) and the desktop clients are
; provisioned via samba/scripts/join-linux-client.sh and join-windows-client.ps1 directly
; (see docs/DeploymentGuide.md#7-endpoints), not through this inventory.

[samba_dc]
samba-dc01 ansible_host=10.10.10.10

[docker_server]
docker01 ansible_host=10.10.10.20

[authentik_host]
authentik01 ansible_host=10.10.10.30

; --- Optional hosts: uncomment each one once it exists. Left commented so site.yml never waits
; --- on a machine a hand-built VMware lab does not have (see docs/DomainJoin.md).
; [proxmox_guests]
; pbs01 ansible_host=10.10.10.50
;
; [scanner]
; scanner01 ansible_host=10.10.10.60

; Hosts that are plain Linux domain members needing common hardening + PKI trust + SSSD join.
[linux_clients:children]
docker_server
authentik_host
; proxmox_guests
; scanner

; Every Linux host managed by this inventory (used by common.yml / pki_trust.yml).
[linux:children]
samba_dc
linux_clients

[all:vars]
ansible_user=labadmin
ansible_python_interpreter=/usr/bin/python3
lab_domain=lab.internal
lab_realm=LAB.INTERNAL
lab_netbios=LAB
