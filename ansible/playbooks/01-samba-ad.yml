---
# Provisions the Samba AD DC (idempotent — the role checks for an existing sam.ldb before
# calling bootstrap-ad.sh) and seeds OUs/groups/users. See docs/SambaAdmin.md.

- name: Provision Samba Active Directory Domain Controller
  hosts: samba_dc
  become: true
  vars_files:
    - "{{ inventory_dir }}/host_vars/samba-dc01/vault.yml"
  roles:
    - samba_ad
