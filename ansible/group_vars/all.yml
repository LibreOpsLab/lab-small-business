---
# Variables common to every host in inventory. Secrets are NOT here — see
# ansible/inventory/host_vars/<host>/vault.yml.example and docs/Security.md#secrets-management.

lab_domain: lab.internal
lab_realm: LAB.INTERNAL
lab_netbios: LAB

samba_dc_ip: 10.10.0.10
samba_dc_fqdn: samba-dc01.lab.internal
dns_forwarder: 10.10.0.1

repo_root_on_controller: "{{ playbook_dir }}/.."

# Root/Issuing CA trust distribution — see ansible/roles/pki_trust.
pki_root_ca_cert: "{{ repo_root_on_controller }}/pki/root-ca/certs/ca.cert.pem"
pki_intermediate_ca_cert: "{{ repo_root_on_controller }}/pki/intermediate-ca/certs/intermediate.cert.pem"

# Host hardening toggles — see ansible/roles/common.
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
unattended_upgrades_enabled: true
