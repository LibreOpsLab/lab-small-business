---
samba_netbios_name: SAMBA-DC01
samba_dc_role: dc
samba_dns_backend: SAMBA_INTERNAL
samba_function_level: "2016"

# samba_admin_password lives in ansible/inventory/host_vars/samba-dc01/vault.yml (Ansible Vault
# encrypted, never plaintext) — but no Ansible role reads it. samba-dc01 is provisioned by hand
# (hypervisor/vms/samba-dc.md); export it as SAMBA_ADMIN_PASSWORD yourself before running
# samba/scripts/bootstrap-ad.sh, which reads the value straight from the environment. See
# vault.yml.example.
