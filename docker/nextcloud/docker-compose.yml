services:
  db:
    image: mariadb:11.4
    container_name: nextcloud-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - nextcloud_db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASS}
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASS}
      MYSQL_DATABASE: ${NEXTCLOUD_DB_NAME:-nextcloud}
      MYSQL_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
    networks:
      - nextcloud-internal

  app:
    image: nextcloud:29-apache
    container_name: nextcloud-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASS}
      MYSQL_DATABASE: ${NEXTCLOUD_DB_NAME:-nextcloud}
      MYSQL_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-nc-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.lab.local
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://cloud.lab.local
      TRUSTED_PROXIES: 172.16.0.0/12
      # OIDC client for Authentik SSO - see authentik/blueprints/oidc-nextcloud.yaml.
      # user_oidc app itself is configured post-install via `occ user_oidc:provider`
      # in authentik/scripts/bootstrap-authentik.sh --sync-secrets.
      NEXTCLOUD_OIDC_CLIENT_ID: ${NEXTCLOUD_OIDC_CLIENT_ID}
      NEXTCLOUD_OIDC_CLIENT_SECRET: ${NEXTCLOUD_OIDC_CLIENT_SECRET}
      NEXTCLOUD_OIDC_DISCOVERY_URL: https://auth.lab.local/application/o/nextcloud/.well-known/openid-configuration
    volumes:
      - nextcloud_data:/var/www/html
      - ../../pki/intermediate-ca/certs/ca-chain.cert.pem:/etc/ssl/certs/lab-ca-chain.pem:ro
    networks:
      - nextcloud-internal
      - lab-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=lab-proxy
      - traefik.http.routers.nextcloud.rule=Host(`cloud.lab.local`)
      - traefik.http.routers.nextcloud.tls=true
      - traefik.http.routers.nextcloud.middlewares=security-headers@file
      - traefik.http.services.nextcloud.loadbalancer.server.port=80

  cron:
    image: nextcloud:29-apache
    container_name: nextcloud-cron
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    entrypoint: /cron.sh
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - nextcloud_data:/var/www/html
    networks:
      - nextcloud-internal

networks:
  nextcloud-internal:
    name: nextcloud-internal
  lab-proxy:
    name: lab-proxy
    external: true

volumes:
  nextcloud_db:
  nextcloud_data:
