# Dovecot IMAP server - authenticates against Samba AD over LDAP (dovecot-ldap.conf.ext),
# no local passwd/shadow accounts. See docs/AuthentikAdmin.md for why Dovecot uses direct
# LDAP bind rather than OIDC — IMAP has no browser-redirect story, so this is the
# deliberate "older, simpler" auth pattern referenced in docs/StudentLabManual.md.
#
# Also acts as: (1) the LMTP delivery target Postfix hands local mail off to (Dovecot owns
# the actual mailbox format/storage, Postfix just routes/authenticates), and (2) the SASL
# auth backend Postfix's submission/smtps listeners use to authenticate senders — both via
# the docker/mail/postfix stack in the same docker-compose.yml. See docker/mail/README.md.

protocols = imap lmtp

listen = *

ssl = required
ssl_cert = </etc/dovecot/tls/fullchain.pem
ssl_key = </etc/dovecot/tls/key.pem
ssl_ca = </etc/dovecot/tls/ca-chain.pem
ssl_min_protocol = TLSv1.2

disable_plaintext_auth = yes

mail_location = maildir:/var/mail/%u

passdb {
  driver = ldap
  args = /etc/dovecot/dovecot-ldap.conf.ext
}

userdb {
  driver = ldap
  args = /etc/dovecot/dovecot-ldap.conf.ext
}

service imap-login {
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  inet_listener imap {
    port = 0
  }
}

# LMTP delivery from Postfix (virtual_transport = lmtp:inet:dovecot:24 in
# docker/mail/postfix/main.cf). Only reachable on the internal mail-internal Docker network,
# never published to the host.
service lmtp {
  inet_listener lmtp {
    address = *
    port = 24
  }
}

# SASL auth backend for Postfix's submission/smtps listeners (smtpd_sasl_path in
# docker/mail/postfix/main.cf). TCP rather than a shared unix socket volume, since Postfix
# and Dovecot are separate containers - internal network only, never published to the host.
service auth {
  inet_listener {
    address = *
    port = 12345
  }
}

log_path = /dev/stderr
info_log_path = /dev/stdout
