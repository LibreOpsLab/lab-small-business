services:
  dovecot:
    image: dovecot/dovecot:2.3-latest
    container_name: dovecot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # IMAPS only - no plaintext IMAP/POP3 exposed, matching the LDAPS-only posture used
      # elsewhere in the lab (see docs/Security.md).
      - "993:993"
    volumes:
      - ./dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./dovecot/dovecot-ldap.conf.ext:/etc/dovecot/dovecot-ldap.conf.ext:ro
      - mail_data:/var/mail
      - ../../pki/issued/mail.lab.internal/fullchain.pem:/etc/dovecot/tls/fullchain.pem:ro
      - ../../pki/issued/mail.lab.internal/key.pem:/etc/dovecot/tls/key.pem:ro
      - ../../pki/intermediate-ca/certs/ca-chain.cert.pem:/etc/dovecot/tls/ca-chain.pem:ro
    # dovecot-ldap.conf.ext above is overwritten with real bind credentials by
    # ansible/roles/docker_engine before this stack starts — see the comment at the top
    # of dovecot/dovecot-ldap.conf.ext. No secrets are templated via environment here
    # because Dovecot's config parser cannot expand them.
    networks:
      - lab-proxy
      - mail-internal
    labels:
      # Not a Traefik-routed HTTP service - IMAPS is TLS-terminated by Dovecot itself and
      # published directly above. Label present only so it's visible in `docker network
      # inspect lab-proxy` alongside the HTTP apps for teaching clarity.
      - traefik.enable=false

  postfix:
    build: ./postfix
    image: lab-postfix:local
    container_name: postfix
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Submission (STARTTLS) + SMTPS (implicit TLS) only. No plain :25 listener — this
      # system never accepts unauthenticated internet mail. See postfix/main.cf.
      - "587:587"
      - "465:465"
    volumes:
      - ./postfix/ldap-virtual-mailbox.cf:/etc/postfix/ldap-virtual-mailbox.cf:ro
      - ../../pki/issued/mail.lab.internal/fullchain.pem:/etc/postfix/tls/fullchain.pem:ro
      - ../../pki/issued/mail.lab.internal/key.pem:/etc/postfix/tls/key.pem:ro
      - ../../pki/intermediate-ca/certs/ca-chain.cert.pem:/etc/postfix/tls/ca-chain.pem:ro
    # ldap-virtual-mailbox.cf's bind_pw is overwritten by ansible/roles/docker_engine before
    # this stack starts, same pattern as Dovecot's LDAP config — see that file's header.
    depends_on:
      - dovecot
    networks:
      - mail-internal
    labels:
      - traefik.enable=false

  # Serves Thunderbird's autoconfig discovery file so account setup is zero-click (type
  # email + password, done) instead of manual server/port entry. See
  # docs/DesktopApps.md#thunderbird-zero-click-via-autoconfig.
  autoconfig:
    image: nginx:1.27-alpine
    container_name: mail-autoconfig
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./autoconfig/config-v1.1.xml:/usr/share/nginx/html/mail/config-v1.1.xml:ro
    networks:
      - lab-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=lab-proxy
      - traefik.http.routers.mail-autoconfig.rule=Host(`autoconfig.lab.internal`)
      - traefik.http.routers.mail-autoconfig.tls=true
      - traefik.http.services.mail-autoconfig.loadbalancer.server.port=80

networks:
  lab-proxy:
    name: lab-proxy
    external: true
  mail-internal:
    name: mail-internal

volumes:
  mail_data:
