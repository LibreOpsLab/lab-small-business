# OpenDKIM milter config. Only started when SPAM_PROTECTION_ENABLED=true (see entrypoint.sh)
# - KeyTable/SigningTable/TrustedHosts are generated at container start from MAIL_DOMAIN /
# DKIM_SELECTOR, not hardcoded here. See docs/SPFDKIMDMARC.md.

Syslog          yes
UMask           002
KeyTable        /etc/opendkim/KeyTable
SigningTable    refile:/etc/opendkim/SigningTable
ExternalIgnoreList  /etc/opendkim/TrustedHosts
InternalHosts       /etc/opendkim/TrustedHosts
Socket          inet:8891@127.0.0.1
PidFile         /var/run/opendkim/opendkim.pid
Mode            sv
Canonicalization    relaxed/simple
SubDomains      no
