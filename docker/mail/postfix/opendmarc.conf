# OpenDMARC milter config. Only started when SPAM_PROTECTION_ENABLED=true (see entrypoint.sh).
# Checks DMARC alignment using the SPF/DKIM results already produced by policyd-spf/OpenDKIM.
# See docs/SPFDKIMDMARC.md.

Socket              inet:8893@127.0.0.1
PidFile             /var/run/opendmarc/opendmarc.pid
Syslog              true
RejectFailures      false
AuthservID           HOSTNAME
TrustedAuthservIDs   HOSTNAME
