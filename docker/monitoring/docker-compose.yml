services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"   # nobody - Prometheus needs no privileges
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    # No Traefik labels and no published ports: Prometheus is reached through Grafana, so
    # there is exactly one authenticated way in. Query it directly with
    # `docker exec prometheus wget -qO- localhost:9090/api/v1/targets` when debugging.

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      # Probes verify the lab certificates properly: the chain is mounted, never skipped.
      - ../../pki/intermediate-ca/certs/ca-chain.cert.pem:/etc/ssl/certs/lab-ca-chain.pem:ro
    networks:
      - monitoring

  # Central log store. Hosts push to it through Traefik (https://loki.lab.internal) with HTTP
  # basic auth, so there is TLS and a credential on the only path in. Loki publishes no ports:
  # Docker would open them straight past the host firewall (docs/HostFirewalls.md).
  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - lab-proxy
      - monitoring
    labels:
      - traefik.enable=true
      - traefik.docker.network=lab-proxy
      - traefik.http.routers.loki.rule=Host(`loki.lab.internal`)
      - traefik.http.routers.loki.tls=true
      - traefik.http.routers.loki.middlewares=loki-push-auth,security-headers@file
      - traefik.http.middlewares.loki-push-auth.basicauth.users=${LOKI_PUSH_USERS:?Set LOKI_PUSH_USERS in .env}
      - traefik.http.services.loki.loadbalancer.server.port=3100

  # Receives pfSense's remote syslog and forwards it to Loki. Syslog has no authentication and
  # no encryption, so this listener is bound to the LAN address only and anything on the LAN can
  # write to it. That is acceptable for a lab firewall feed; say so in the threat model. Docker
  # opens this port past the host firewall (docs/HostFirewalls.md), so the bind address is the
  # only restriction. See pfsense/remote-logging.md.
  alloy-syslog:
    image: grafana/alloy:v1.17.0
    container_name: alloy-syslog
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --disable-reporting
      - /etc/alloy/config.alloy
    ports:
      - "${SYSLOG_BIND_ADDRESS:-10.10.10.20}:1514:1514/udp"
      - "${SYSLOG_BIND_ADDRESS:-10.10.10.20}:1514:1514/tcp"
    volumes:
      - ./alloy-syslog/config.alloy:/etc/alloy/config.alloy:ro
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      GF_SERVER_ROOT_URL: https://grafana.lab.internal
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Authentik forward-auth (Traefik authentik-forwardauth middleware) authenticates the
      # request, then passes the username in X-authentik-username. Grafana trusts that header.
      # This is safe only because Grafana publishes no ports: the sole route to it is Traefik,
      # which overwrites the header from Authentik's answer. Do not add a ports: section.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-authentik-username
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - lab-proxy
      - monitoring
    labels:
      - traefik.enable=true
      - traefik.docker.network=lab-proxy
      - traefik.http.routers.grafana.rule=Host(`grafana.lab.internal`)
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.middlewares=authentik-forwardauth@file,security-headers@file
      - traefik.http.services.grafana.loadbalancer.server.port=3000

networks:
  lab-proxy:
    name: lab-proxy
    external: true
  monitoring:
    name: lab-monitoring

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
