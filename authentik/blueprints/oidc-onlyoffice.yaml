version: 1
metadata:
  name: "LAB - OnlyOffice OIDC Provider"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # OnlyOffice Document Server itself has no browser-facing OIDC login - it's driven by
  # NextCloud's ONLYOFFICE connector app over the internal Docker network (see
  # docker/onlyoffice/docker-compose.yml). This provider exists so document-server-initiated
  # webhook/callback requests can be verified against Authentik if the connector's own JWT
  # signing (ONLYOFFICE_JWT_SECRET) is later swapped for OIDC-based verification - kept as a
  # standalone client, per docs/AuthentikAdmin.md's "never share client secrets" rule.
  - model: authentik_flows.flow
    identifiers:
      slug: default-provider-authorization-implicit-consent
    id: default-authz-flow

  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: "OnlyOffice"
    attrs:
      authorization_flow: !KeyOf default-authz-flow
      client_type: confidential
      client_id: onlyoffice
      client_secret: "!Env{ONLYOFFICE_OIDC_CLIENT_SECRET}"
      redirect_uris: "https://docs.lab.local/oauth/callback"
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
    id: onlyoffice-provider

  - model: authentik_core.application
    identifiers:
      slug: onlyoffice
    attrs:
      name: OnlyOffice
      provider: !KeyOf onlyoffice-provider
      meta_launch_url: "https://docs.lab.local"
      meta_description: "Lab document editing backend (used via NextCloud's ONLYOFFICE app)."
      policy_engine_mode: any
