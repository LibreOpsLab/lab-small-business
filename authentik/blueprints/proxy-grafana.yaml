version: 1
metadata:
  name: "LAB - Grafana Forward-Auth"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Grafana is gated with Authentik's forward-auth pattern (same as Stirling PDF): Traefik asks
  # the embedded outpost whether the request is authenticated, then Grafana trusts the
  # X-authentik-username header via its auth-proxy mode. See docker/monitoring/README.md and
  # docker/reverse-proxy/traefik/dynamic.yml's authentik-forwardauth middleware.
  - model: authentik_flows.flow
    identifiers:
      slug: default-provider-authorization-implicit-consent
    id: default-authz-flow

  - model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: "Grafana"
    attrs:
      authorization_flow: !KeyOf default-authz-flow
      mode: forward_single
      external_host: "https://grafana.lab.internal"
      internal_host: "http://grafana:3000"
      internal_host_ssl_validation: false
    id: grafana-provider

  - model: authentik_core.application
    identifiers:
      slug: grafana
    attrs:
      name: "Grafana"
      provider: !KeyOf grafana-provider
      meta_launch_url: "https://grafana.lab.internal"
      meta_description: "Lab monitoring dashboards - gated by Authentik forward-auth."
      policy_engine_mode: any

  # Same caveat as proxy-stirling-pdf.yaml: if the provider does not appear on the embedded
  # outpost automatically, add "Grafana" under Applications > Outposts > authentik Embedded
  # Outpost (one-time).
  - model: authentik_outposts.outpost
    identifiers:
      name: "authentik Embedded Outpost"
    attrs:
      providers:
        - !KeyOf grafana-provider
    state: present
