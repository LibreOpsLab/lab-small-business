version: 1
metadata:
  name: "LAB - NextCloud OIDC Provider"
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_flows.flow
    identifiers:
      slug: default-provider-authorization-implicit-consent
    id: default-authz-flow

  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      scope_name: groups
      managed: "goauthentik.io/providers/oauth2/scope-groups"
    id: scope-groups

  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: "NextCloud"
    attrs:
      authorization_flow: !KeyOf default-authz-flow
      client_type: confidential
      client_id: nextcloud
      client_secret: "!Env{NEXTCLOUD_OIDC_CLIENT_SECRET}"
      redirect_uris: "https://cloud.lab.internal/apps/user_oidc/code"
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
        - !KeyOf scope-groups
    id: nextcloud-provider

  - model: authentik_core.application
    identifiers:
      slug: nextcloud
    attrs:
      name: NextCloud
      provider: !KeyOf nextcloud-provider
      meta_launch_url: "https://cloud.lab.internal"
      meta_description: "Lab file storage and collaboration (SSO via Authentik)."
      policy_engine_mode: any
