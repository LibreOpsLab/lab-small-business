// Authoritative DNS for the "lab.internet" class root zone. Not a recursive resolver for
// anything else — this server only ever answers for lab.internet and its delegated business
// subdomains. See docs/ClassRegistry.md#dns-design.

include "/etc/bind/keys/rndc.key";

controls {
    // Internal Docker network only (class-registry) - never published to the host. The
    // registry container is the only other member of that network and is the only thing
    // that ever calls rndc. See federation/class-registry/scripts/init-registry.sh for key
    // generation.
    inet 0.0.0.0 port 953 allow { any; } keys { "rndc-key"; };
};

options {
    directory "/var/cache/bind";
    recursion no;
    allow-query { any; };
    listen-on { any; };
    listen-on-v6 { none; };
};

zone "lab.internet" {
    type master;
    file "/etc/bind/zones/db.lab.internet";
    allow-transfer { none; };
    // Rewritten + reloaded by the registry app on every registration - see app/app.py's
    // regenerate_zone_file() and docs/ClassRegistry.md#dns-design.
};
